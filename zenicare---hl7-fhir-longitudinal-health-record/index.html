    <script>
      // Compatibility shim for browser extensions attempting to assign window.fetch
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const _nativeFetch = window.fetch.bind(window);
          let _activeFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: () => _activeFetch,
            set: (fn) => { _activeFetch = fn; },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {}
    </script>
